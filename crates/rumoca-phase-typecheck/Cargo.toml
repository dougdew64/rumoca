[package]
name = "rumoca-phase-typecheck"
description = "Type checking for the Rumoca compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Optional observability, matching the convention already used by
# rumoca-phase-{dae,flatten,instantiate,resolve,structural}: off by default, so a
# consumer that does not want the dependency does not pay for it.
tracing = ["dep:tracing"]

[dependencies]
rumoca-core = { workspace = true }
rumoca-eval-ast = { workspace = true }
rumoca-ir-ast = { workspace = true }
rustc-hash = { workspace = true }
thiserror = { workspace = true }
miette = { workspace = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
rumoca-phase-parse = { workspace = true }
rumoca-phase-resolve = { workspace = true }

[lints]
workspace = true
